name: Feature request
description: Propose an improvement with a concrete use case.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe what you are trying to do and the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired result and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and safety considerations
      description: If relevant, include Windows versions, hardware, policy restrictions, and configuration changes.
