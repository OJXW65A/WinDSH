name: WinDSH CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: '1.7.7'
  # The release's own published checksum for the linux_amd64 archive. Pinning the
  # hash as well as the tag means a re-published release cannot change what CI runs.
  ACTIONLINT_SHA256: '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757'

jobs:
  # A workflow that fails GitHub's schema validation is rejected at load time: the run
  # reports a bare failure with zero jobs and no logs, and every check below silently
  # stops running with nothing to say so. That has happened in this repository. The file
  # is still valid YAML, so only a schema-aware linter catches it -- not review, and not
  # any of the checks below.
  workflows:
    name: Workflow files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          set -euo pipefail
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" \
              "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${file}"
          ( cd "$RUNNER_TEMP" && printf '%s  %s\n' "$ACTIONLINT_SHA256" "$file" | sha256sum --check --strict )
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" actionlint
          chmod +x "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint" --version

      - name: Run actionlint
        run: |
          set -euo pipefail
          # No file arguments: actionlint discovers every workflow under
          # .github/workflows, so a workflow added later is covered without
          # anyone remembering to edit this job.
          if ! "$RUNNER_TEMP/actionlint"; then
              echo '::error::actionlint reported problems in .github/workflows.'
              echo '::error::GitHub rejects a workflow that fails validation at load time, and then runs no jobs at all.'
              exit 1
          fi
          echo 'actionlint: 0 findings.'

  # WinDSH.ps1 is generated from src/. This guards the one mistake that would ship a
  # build whose integrity hash is stale, which disables all remediation for every user.
  build:
    name: Built file is current
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify WinDSH.ps1 matches src/
        shell: powershell
        run: |
          .\build\Build-WinDSH.ps1 -Check
          if ($LASTEXITCODE -ne 0) {
              Write-Host '::error::WinDSH.ps1 is out of date with src/.'
              Write-Host '::error::Run .\build\Build-WinDSH.ps1 and commit the result.'
              exit 1
          }

      - name: Verify CHANGELOG mentions the declared version
        shell: powershell
        run: |
          $version = [regex]::Match((Get-Content -Raw .\WinDSH.ps1), "ToolVersion\s*=\s*'([^']+)'").Groups[1].Value
          Write-Host "Script version: $version"
          if ((Get-Content -Raw .\CHANGELOG.md) -notmatch [regex]::Escape($version)) {
              Write-Host "::error::CHANGELOG.md has no entry for version $version."
              exit 1
          }

  analyze:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    # The matrix context is not available on a step's `shell:` key, which made the
    # whole workflow fail validation before any job could start. It is available on
    # the job's run defaults, which apply to every step here.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            shell: powershell
          - name: PowerShell 7
            shell: pwsh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show PowerShell version
        run: $PSVersionTable | Format-List

      - name: Parse all sources
        run: |
          $failed = $false
          $targets = @(Get-ChildItem "$env:GITHUB_WORKSPACE\src" -Filter *.ps1) +
                     @(Get-Item "$env:GITHUB_WORKSPACE\WinDSH.ps1") +
                     @(Get-ChildItem "$env:GITHUB_WORKSPACE\build" -Filter *.ps1) +
                     @(Get-ChildItem "$env:GITHUB_WORKSPACE\tests" -Filter *.ps1)
          foreach ($t in $targets) {
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($t.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
              if (@($parseErrors).Count -gt 0) {
                  Write-Host "::error file=$($t.Name)::$(@($parseErrors).Count) syntax error(s)"
                  $parseErrors | Format-List Message, Extent
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }
          Write-Host "Syntax check passed for $(@($targets).Count) file(s)."

      - name: Install PSScriptAnalyzer
        run: |
          .\build\Install-CIDependencies.ps1 -Name PSScriptAnalyzer -Destination "$env:RUNNER_TEMP\windsh-verified-modules"

      - name: Run PSScriptAnalyzer
        run: |
          $pin = (Get-Content -Raw .\.github\psgallery-lock.json | ConvertFrom-Json).PSScriptAnalyzer
          Import-Module "$env:RUNNER_TEMP\windsh-verified-modules\PSScriptAnalyzer\$($pin.version)\PSScriptAnalyzer.psd1" -Force
          # Use the same zero-error/zero-warning check contributors run locally.
          .\build\Test-CodeQuality.ps1

      - name: Install Pester
        run: |
          .\build\Install-CIDependencies.ps1 -Name Pester -Destination "$env:RUNNER_TEMP\windsh-verified-modules"

      - name: Run Pester tests
        run: |
          $pin = (Get-Content -Raw .\.github\psgallery-lock.json | ConvertFrom-Json).Pester
          Import-Module "$env:RUNNER_TEMP\windsh-verified-modules\Pester\$($pin.version)\Pester.psd1" -Force
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = "$env:GITHUB_WORKSPACE\tests"
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $configuration
          if ($result.Result -ne 'Passed' -or $result.PassedCount -lt 1) {
              Write-Host "::error::Pester failed or ran no passing tests: result=$($result.Result), passed=$($result.PassedCount), failed=$($result.FailedCount)."
              exit 1
          }
          Write-Host "Pester passed: $($result.PassedCount) test(s)."

  # Exercises the collector chain against a real Windows machine. GitHub runners are
  # elevated, so the live audit path runs. This is the coverage synthetic tests cannot give.
  audit-smoke:
    name: Live audit smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Real audit, all three report formats
        shell: powershell
        run: |
          .\WinDSH.ps1 -AuditOnly -HtmlReport -JsonReport -TextReport -ReportDirectory "$env:GITHUB_WORKSPACE\ci-report"
          $code = $LASTEXITCODE
          Write-Host "Exit code: $code"
          if ($code -ne 0 -and $code -ne 2 -and $code -ne 3010) {
              Write-Host "::error::Audit returned unexpected exit code $code."
              exit 1
          }
          # WinDSH's own non-zero-but-accepted exit code stays in $LASTEXITCODE and
          # would fail the step regardless of the check above. Land on 0 explicitly.
          exit 0

      - name: Validate the reports
        shell: powershell
        run: |
          foreach ($ext in 'html', 'json', 'txt') {
              $file = Get-ChildItem "$env:GITHUB_WORKSPACE\ci-report\*.$ext" | Select-Object -First 1
              if (-not $file) { Write-Host "::error::No .$ext report was produced."; exit 1 }
              Write-Host "$ext report: $($file.Name) ($($file.Length) bytes)"
          }

          $json = Get-Content -Raw (Get-ChildItem "$env:GITHUB_WORKSPACE\ci-report\*.json" | Select-Object -First 1) | ConvertFrom-Json
          foreach ($field in 'SchemaVersion', 'Tool', 'Score', 'Controls', 'Cis') {
              if ($null -eq $json.$field) { Write-Host "::error::JSON report missing field: $field"; exit 1 }
          }
          Write-Host "Score: $($json.Score.Score)/100 ($($json.Score.Grade))"

          $html = Get-Content -Raw (Get-ChildItem "$env:GITHUB_WORKSPACE\ci-report\*.html" | Select-Object -First 1)
          if ($html -match '<script' -or $html -match 'https?://[^"]*\.(css|js)') {
              Write-Host '::error::HTML report is not self-contained.'
              exit 1
          }
          Write-Host 'Reports validated.'

      - name: RMM mode emits exactly one JSON object
        shell: powershell
        run: |
          $lines = @(& .\WinDSH.ps1 -AuditOnly -Rmm | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($lines.Count -ne 1) {
              Write-Host "::error::RMM mode emitted $($lines.Count) lines, expected 1."
              $lines | ForEach-Object { Write-Host $_ }
              exit 1
          }
          $obj = $lines[0] | ConvertFrom-Json
          Write-Host "RMM score: $($obj.score)"
          exit 0

      - name: Preview mode writes nothing
        shell: powershell
        run: |
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
          $before = Get-ItemProperty $key -ErrorAction SilentlyContinue | ConvertTo-Json -Compress
          .\WinDSH.ps1 -EnableAllSafe -WhatIf -NoReport | Out-Null
          $after = Get-ItemProperty $key -ErrorAction SilentlyContinue | ConvertTo-Json -Compress
          if ($before -ne $after) {
              Write-Host '::error::-WhatIf modified the DeviceGuard registry key.'
              exit 1
          }
          Write-Host '-WhatIf made no registry changes, as expected.'
          exit 0
