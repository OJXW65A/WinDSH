name: WinDSH CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show PowerShell version
        shell: powershell
        run: |
          $PSVersionTable

      - name: Parse WinDSH.ps1
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null

          [System.Management.Automation.Language.Parser]::ParseFile(
              "$env:GITHUB_WORKSPACE\WinDSH.ps1",
              [ref]$tokens,
              [ref]$parseErrors
          ) | Out-Null

          if (@($parseErrors).Count -gt 0) {
              Write-Host "PowerShell syntax errors found:" -ForegroundColor Red

              $parseErrors |
                  Format-List Message, Extent, ErrorId

              exit 1
          }

          Write-Host "Windows PowerShell 5.1 syntax check passed." -ForegroundColor Green

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          Install-Module PSScriptAnalyzer `
              -Scope CurrentUser `
              -Force `
              -Repository PSGallery

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: |
          $results = @(
              Invoke-ScriptAnalyzer `
                  -Path "$env:GITHUB_WORKSPACE\WinDSH.ps1"
          )

          if ($results.Count -gt 0) {
              $results |
                  Select-Object RuleName, Severity, Line, Message |
                  Format-Table -AutoSize
          }

          $errors = @(
              $results |
                  Where-Object {
                      $_.Severity -eq 'Error'
                  }
          )

          if ($errors.Count -gt 0) {
              Write-Host ""
              Write-Host "PSScriptAnalyzer errors detected." -ForegroundColor Red
              exit 1
          }

          Write-Host ""
          Write-Host "PSScriptAnalyzer completed without errors." -ForegroundColor Green

      - name: Install Pester
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          Install-Module Pester `
              -RequiredVersion 5.9.1 `
              -Scope CurrentUser `
              -Force `
              -Repository PSGallery

      - name: Run Pester tests
        shell: powershell
        run: |
          Import-Module Pester `
              -RequiredVersion 5.9.1 `
              -Force

          $configuration = New-PesterConfiguration

          $configuration.Run.Path = "$env:GITHUB_WORKSPACE\tests"
          $configuration.Run.PassThru = $true

          $configuration.Output.Verbosity = 'Detailed'

          $result = Invoke-Pester `
              -Configuration $configuration

          if ($result.FailedCount -gt 0) {
              Write-Host ""
              Write-Host (
                  "Pester failed: {0} test(s) failed." -f
                  $result.FailedCount
              ) -ForegroundColor Red

              exit 1
          }

          Write-Host ""
          Write-Host (
              "Pester passed: {0} test(s)." -f
              $result.PassedCount
          ) -ForegroundColor Green


  powershell-7:
