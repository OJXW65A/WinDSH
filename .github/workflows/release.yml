name: WinDSH Release

# Releases are produced ONLY by this workflow, from this repository's source.
# Build provenance and checksums refer to the workflow's exact source and payload.
# Never hand-upload a release asset or replace a published artifact.
#
# To cut a release:
#   1. Make sure main is green and the version in WinDSH.ps1 is correct.
#   2. Push the version tag, or request a draft from main with Run workflow.
#   3. Review and publish the workflow-created draft release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create the version tag and a draft release from main'
        type: boolean
        required: true
        default: false

permissions:
  contents: write       # create the GitHub Release
  id-token: write       # OIDC token for build provenance
  attestations: write   # write the provenance attestation

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: version
        shell: powershell
        run: |
          $source = Get-Content -Raw .\WinDSH.ps1
          $scriptVersion = [regex]::Match($source, "ToolVersion\s*=\s*'([^']+)'").Groups[1].Value
          if ($scriptVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') {
              throw 'ToolVersion must be a version suitable for a release tag.'
          }
          Write-Host "Version in WinDSH.ps1: $scriptVersion"

          if ($env:GITHUB_REF -like 'refs/tags/*') {
              $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
              $tagVersion = $tag -replace '^v', ''
              Write-Host "Tag: $tag"

              if ($tagVersion -ne $scriptVersion) {
                  Write-Host "::error::Tag $tag does not match the script version $scriptVersion."
                  Write-Host '::error::Update ToolVersion (and the integrity hash) or retag.'
                  exit 1
              }
          }
          else {
              $tag = "v$scriptVersion"
              Write-Host "Not a tag build. Using $tag for artifact naming."
          }

          "version=$scriptVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag"              | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate manual release request
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        shell: powershell
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw 'Create a draft release only from main after its CI checks pass.'
          }
          $existingTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing release tags.' }
          if ($existingTag) {
              throw "Tag $env:RELEASE_TAG already exists. Review its release; never replace a public tag or its assets."
          }

      - name: Verify the build is current
        shell: powershell
        run: |
          # v2 generates WinDSH.ps1 from src/ and stamps the integrity hash during the
          # build, so verifying the build is current also verifies the hash. This
          # replaces tools\Update-IntegrityHash.ps1, which v1.5.0 used and v2 removed.
          .\build\Build-WinDSH.ps1 -Check
          if ($LASTEXITCODE -ne 0) {
              Write-Host '::error::Refusing to release: WinDSH.ps1 is out of date with src/.'
              Write-Host '::error::A stale build ships a wrong integrity hash, which disables all remediation.'
              exit 1
          }

      - name: Refuse existing releases
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: .\build\Test-ReleaseTarget.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG

      - name: Install Pester
        shell: powershell
        run: |
          .\build\Install-CIDependencies.ps1 -Name Pester -Destination "$env:RUNNER_TEMP\windsh-verified-modules"

      - name: Run tests
        shell: powershell
        run: |
          $pin = (Get-Content -Raw .\.github\psgallery-lock.json | ConvertFrom-Json).Pester
          Import-Module "$env:RUNNER_TEMP\windsh-verified-modules\Pester\$($pin.version)\Pester.psd1" -Force
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = "$env:GITHUB_WORKSPACE\tests"
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $configuration
          if ($result.FailedCount -gt 0) {
              Write-Host '::error::Refusing to release with failing tests.'
              exit 1
          }

      - name: Stage release artifacts
        id: stage
        shell: powershell
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $stage = "$env:GITHUB_WORKSPACE\dist\WinDSH-v$version"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          # Full bundle with documentation, licensing, and security information.
          $payload = @(
              'WinDSH.ps1'
              'Run-WinDSH-AsAdmin.bat'
              'README.md'
              'CHANGELOG.md'
              'LICENSE'
              'SECURITY.md'
              'CODE_SIGNING_POLICY.md'
              'CONTRIBUTING.md'
              'CLAUDE.md'
              'docs/USAGE.md'
              'docs/REPORT_SCHEMA.md'
              'docs/RELEASING.md'
              'assets/bitcoin-qr.png'
          )
          foreach ($file in $payload) {
              if (-not (Test-Path -LiteralPath $file)) {
                  Write-Host "::error::Release payload file missing: $file"
                  exit 1
              }
              $destination = Join-Path $stage $file
              New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
              Copy-Item -LiteralPath $file -Destination $destination -Force
          }

          Get-ChildItem $stage -Recurse -File | Select-Object Name, Length | Format-Table -AutoSize

          $zip = "$env:GITHUB_WORKSPACE\dist\WinDSH-v$version.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          Write-Host "Created: $zip"

          # Stable asset name lets the README link to the latest public download.
          # This ZIP contains only the launcher and the application at its root.
          .\build\Build-Download.ps1 -OutputPath "$env:GITHUB_WORKSPACE\dist\WinDSH.zip"

          "stage=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Generate SHA256SUMS
        shell: powershell
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $dist = "$env:GITHUB_WORKSPACE\dist"
          $stage = '${{ steps.stage.outputs.stage }}'
          $sumsPath = "$dist\SHA256SUMS-WinDSH-v$version.txt"

          $lines = @()
          foreach ($file in (Get-ChildItem $stage -Recurse -File | Sort-Object FullName)) {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
              $relativePath = $file.FullName.Substring($stage.Length + 1) -replace '\\', '/'
              $lines += ('{0}  {1}' -f $hash, $relativePath)
          }
          foreach ($zipFile in (Get-ChildItem $dist -Filter '*.zip' -File | Sort-Object Name)) {
              $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipFile.FullName).Hash.ToLowerInvariant()
              $lines += ('{0}  {1}' -f $zipHash, $zipFile.Name)
          }

          # LF endings so the file verifies cleanly with sha256sum on any platform.
          [IO.File]::WriteAllText($sumsPath, (($lines -join "`n") + "`n"), (New-Object Text.UTF8Encoding($false)))

          Write-Host '--- SHA256SUMS ---'
          Get-Content $sumsPath | Write-Host

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.zip
            dist/SHA256SUMS-*.txt

      # Introduce Authenticode signing only when a provider is available. The
      # final signed payload must be checksummed and attested after signing.
      # Current artifacts are unsigned; do not claim signing sponsorship.

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WinDSH-${{ steps.version.outputs.tag }}
          path: dist/
          retention-days: 30

      - name: Recheck release target before uploading
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: .\build\Test-ReleaseTarget.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        shell: powershell
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # GITHUB_TOKEN tag pushes do not start another workflow run. This run
          # has already verified, tested, packaged, and attested the exact commit.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $env:RELEASE_TAG $env:GITHUB_SHA -m "WinDSH $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the release tag.' }
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push the release tag.' }

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: WinDSH ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS-*.txt
          body: |
            ## WinDSH ${{ steps.version.outputs.tag }}

            Built by GitHub Actions from this repository. See `CHANGELOG.md` for changes.

            ### Download and run

            Download **WinDSH.zip**, extract all files, then double-click
            **Run-WinDSH-AsAdmin.bat** in the extracted folder and approve the
            administrator prompt. The ZIP contains only the launcher and **WinDSH.ps1**.
            The versioned ZIP also includes documentation and licensing information.

            ### Verifying this download

            ```powershell
            Get-FileHash -Algorithm SHA256 .\WinDSH.ps1
            ```

            Compare the result with `SHA256SUMS-WinDSH-${{ steps.version.outputs.tag }}.txt`.

            ### Code signing status

            This release is **not yet Authenticode signed**. Verify it using the SHA-256
            checksums above. There is currently no signing certificate or sponsorship.

            The SHA-256 self-check inside WinDSH detects accidental corruption only. It is
            not a substitute for publisher authentication.
